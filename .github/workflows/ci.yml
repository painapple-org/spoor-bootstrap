name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # shellcheck ships preinstalled on GitHub's ubuntu runner images, so this
      # needs no install step. Run at the strictest severity: this repo is a
      # handful of shell lines and currently passes clean at that level, so
      # there is nothing to justify an --exclude for. Add one only alongside a
      # comment saying which check and why.
      - name: Shellcheck every tracked shell script
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          if [[ ${#scripts[@]} -eq 0 ]]; then
            echo "No .sh files tracked in git — nothing to check." >&2
            exit 1
          fi
          printf 'Checking: %s\n' "${scripts[@]}"
          shellcheck --severity=style "${scripts[@]}"

  # shellcheck above only reads install.sh; nothing there notices a change that
  # is valid shell but a broken bootstrap on a fresh box (a missing apt
  # prerequisite, an installer invoked in a way that leaves its binary off
  # PATH). This job actually executes it in a fresh ubuntu:24.04 container,
  # once per privilege shape install.sh supports, and asserts the result. The
  # assertions, and why the container needs each of the flags it is given
  # below, live in the test script itself.
  install-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [root, sudo-user]
    steps:
      # persist-credentials: false because the checkout's .git is mounted into
      # the test container; there is no reason for a real token to be in it.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # install.sh refuses to run against a checkout whose origin is upstream,
      # since an adopter is meant to work from their own copy (a private repo
      # by default, or a fork if they opt into that) — and a CI checkout is
      # upstream by definition. Repoint origin at a stand-in URL so the
      # guard's pass path is what gets exercised. Nothing ever contacts it;
      # the check only reads the remote's string.
      - name: Point origin at a stand-in remote
        run: git remote set-url origin https://github.com/spoor-bootstrap-ci/stand-in-remote.git

      # A steps-level docker run on the runner VM, deliberately not a job-level
      # `container:`. The test needs --privileged for the nested daemon, and
      # Actions gives no way to pass that to a container job — only the VM's
      # own docker, driven from a step like this, can.
      #
      # --privileged and the anonymous volume on /var/lib/docker are both
      # required for the nested dockerd the test script starts; the script's
      # header records which failure each one prevents. -v with no source is
      # an anonymous volume, which --rm cleans up with the container.
      - name: Execute install.sh in a fresh ubuntu:24.04 container
        run: |
          docker run --rm \
            --privileged \
            -v /var/lib/docker \
            -v "$PWD:/src:ro" \
            ubuntu:24.04 \
            bash /src/.github/ci/install-smoke-test.sh '${{ matrix.mode }}'

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Ask git for the file list rather than globbing the filesystem, the same
      # way the shellcheck job does: tracked files are what a clone actually
      # gets, and a stray untracked .md in a working directory isn't this job's
      # business. It also drops the harness-native skills paths for free —
      # each is tracked as a single symlink to skills/, not as a second copy of
      # every SKILL.md, so globbing through them would re-check each file at a
      # fake path where its own relative links resolve to nothing. That the
      # symlinks point where they should is the symlinks job's assertion.
      - name: Collect tracked markdown files
        id: markdown
        run: |
          mapfile -t files < <(git ls-files '*.md')
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No .md files tracked in git — nothing to check." >&2
            exit 1
          fi
          # This list reaches the next step by being expression-interpolated
          # into lychee-action's `args`, and that action's entrypoint runs its
          # argument string through `eval` — so a filename carrying shell
          # metacharacters executes as code on the runner, and on a public repo
          # taking fork pull requests every tracked filename is attacker-
          # controlled. No quoting on this side survives an `eval` on the far
          # side, so constrain the list instead: a plain relative path, and no
          # leading dash for lychee to read as one of its own flags. Every path
          # this repo tracks already satisfies that, and one that doesn't fails
          # here rather than being silently dropped from the link check.
          for file in "${files[@]}"; do
            if [[ ! "$file" =~ ^[A-Za-z0-9._][A-Za-z0-9._/-]*$ ]]; then
              echo "FAIL: tracked markdown path '${file}' is not a plain relative path." >&2
              echo "It would be interpolated into a shell-evaluated argument list. Rename the file." >&2
              exit 1
            fi
          done
          printf 'Checking: %s\n' "${files[@]}"
          printf 'files=%s\n' "${files[*]}" >> "$GITHUB_OUTPUT"

      # Catches dead relative links between docs (the common regression when a
      # file moves or a skill is renamed) as well as dead external URLs.
      - name: Check markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --include-fragments
            --max-retries 3
            --accept 200,206,429
            ${{ steps.markdown.outputs.files }}
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The links job above proves every link resolves to a file; nothing proves
  # the docs are still telling the truth *about* those files. Every rule this
  # script enforces was caught by hand during review at least once — a stub's
  # Status heading outliving its TODO(specialize) markers, the skills/README.md
  # index drifting out of the pass order specialize-skills defines, a "STARTUP.md
  # step N" reference surviving a renumbering — which is exactly the kind of
  # thing that regresses as soon as nobody happens to be reading. Which rule
  # exists for which real failure lives in the script's own header.
  skills-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Stdlib-only python3, preinstalled on the runner image — no setup-python
      # step and no dependencies to pin.
      - name: Check skills/ against its own indexes and cross-references
        run: .github/ci/check-skills-consistency.py

  # `spoor-doctor` is the one thing in this repo whose whole value is being
  # trusted when it says a deployment is healthy — a diagnostic that misses a
  # break converts a fixable problem into a documented absence of one. So it
  # is not enough for it to run: every check it makes has to be shown to
  # actually catch its own failure. The test script builds a real fixture
  # deployment per case (its own git repos on disk, a real `.env`, local
  # servers standing in for the tracker and mail host), breaks one thing, and
  # asserts the doctor names that check. What each case injects, and why the
  # fixture is shaped the way it is, lives in that script's own header.
  doctor-self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Stdlib-only python3 and git, both preinstalled on the runner image.
      # The test binds only loopback sockets and pushes only to bare repos in
      # a temp directory, so it needs no network and no credentials.
      - name: Prove spoor-doctor catches a broken deployment
        run: .github/ci/test-doctor.py

  # The job above proves each of the doctor's checks catches its own failure.
  # It says nothing about the layer that decides whether a human is told:
  # `spoor-doctor-watch` is what a schedule invokes, and its two failure modes
  # both look fine from the outside — staying quiet when something just broke,
  # or re-alerting every run of an already-known break until the channel gets
  # filtered. So this job drives the watcher through a deployment's whole life
  # (healthy, broken, still broken, fixed) against a stub doctor it controls,
  # and then against the real one in the checkout. What each case covers lives
  # in that script's own header.
  doctor-watch-self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Stdlib-only python3, preinstalled on the runner image. Every doctor run
      # it makes is --offline or against its own stub, so this needs no network
      # and no credentials.
      - name: Prove spoor-doctor-watch alerts on a change and only on a change
        run: .github/ci/test-doctor-watch.py

  # `spoor-profile` claims a written business profile produces the same artifacts
  # a live first-boot interview produces. Nothing else in CI could notice if that
  # stopped being true: the generator would keep exiting 0 and writing a
  # plausible-looking `.env`. This job generates every profile under examples/
  # into a real fixture deployment and runs `spoor-doctor` against the result,
  # asserts the one profile that has a narrated counterpart reproduces that
  # walkthrough's own `.env` key for key, and asserts an invalid profile is
  # refused without writing anything. What each case covers lives in the test
  # script's own header.
  profile-generator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Stdlib-only python3 (tomllib included) and git, both preinstalled on the
      # runner image. Every remote the fixture uses is a bare repo in a temp
      # directory and the doctor runs --offline, so this needs no network and no
      # credentials.
      - name: Generate every example profile and doctor the result
        run: .github/ci/test-profile.py

  symlinks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The runtime equivalent of this lives in install.sh, guarding against a
      # "Download ZIP" copy that flattens each symlink into a plain text file.
      # This job catches the other direction: a commit that replaces one of the
      # symlinks with a real file or directory, which would ship a broken
      # template that install.sh only rejects once someone runs it.
      - name: Verify harness skill symlinks
        run: |
          status=0
          for dir in .claude/skills .opencode/skills .agents/skills; do
            mode="$(git ls-files --stage -- "$dir" | awk '{print $1}')"
            if [[ "$mode" != "120000" ]]; then
              echo "FAIL: $dir is committed with git mode '${mode:-missing}', expected 120000 (symlink)." >&2
              status=1
              continue
            fi
            target="$(readlink "$dir")"
            if [[ "$target" != "../skills" ]]; then
              echo "FAIL: $dir points at '$target', expected '../skills'." >&2
              status=1
            fi
            if [[ ! -d "$dir" ]]; then
              echo "FAIL: $dir does not resolve to a directory." >&2
              status=1
            fi
            if [[ ! -f "$dir/README.md" ]]; then
              echo "FAIL: $dir/README.md is not readable through the symlink." >&2
              status=1
            fi
            if [[ $status -eq 0 ]]; then
              echo "OK: $dir -> $target"
            fi
          done
          exit $status
